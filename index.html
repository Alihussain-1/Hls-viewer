<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLS Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
    body{
        margin:0;
        background:#111;
        font-family:Arial;
        color:white;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:20px;
    }

    h1{
        margin-bottom:20px;
    }

    .controls{
        width:90%;
        max-width:900px;
        display:flex;
        gap:10px;
        margin-bottom:20px;
    }

    input{
        flex:1;
        padding:12px;
        border:none;
        border-radius:8px;
        font-size:16px;
    }

    button{
        padding:12px 20px;
        border:none;
        border-radius:8px;
        background:#00bcd4;
        color:white;
        cursor:pointer;
        font-size:16px;
    }

    video{
        width:90%;
        max-width:900px;
        background:black;
        border-radius:12px;
    }

    .status{
        margin-top:10px;
        color:#ccc;
    }
</style>
</head>

<body>

<h1>HLS M3U8 Player</h1>

<div class="controls">
    <input
        type="text"
        id="urlInput"
        placeholder="Paste .m3u8 URL here"
    >

    <button onclick="loadVideo()">
        Play
    </button>
</div>

<video id="video" controls autoplay></video>

<div class="status" id="status"></div>

<script>
    let hls;

    function loadVideo() {

        const video = document.getElementById('video');
        const url = document.getElementById('urlInput').value.trim();
        const status = document.getElementById('status');

        if (!url) {
            status.innerText = 'Please enter a URL';
            return;
        }

        status.innerText = 'Loading...';

        if (hls) {
            hls.destroy();
        }

        if (Hls.isSupported()) {

            hls = new Hls();

            hls.loadSource(url);

            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function () {

                video.play();

                status.innerText = 'Playing';
            });

            hls.on(Hls.Events.ERROR, function(event, data) {

                status.innerText =
                    'Error: ' + data.details;

                console.log(data);
            });

        } else if (
            video.canPlayType('application/vnd.apple.mpegurl')
        ) {

            video.src = url;

            video.addEventListener('loadedmetadata', function () {

                video.play();

                status.innerText = 'Playing';
            });

        } else {

            status.innerText =
                'HLS not supported in this browser';
        }
    }
</script>

</body>
</html>
